[[exemptions.cms]]
version = "0.3.0-rc.0"
criteria = "safe-to-deploy"
notes = "Baseline (critical, not yet audited): 6,300 lines, forbid(unsafe_code). The engine builds and parses CMS SignedData with it (RFC 5652); full review planned with the 0.3.0 final release, which the engine adopts only with an audit."

