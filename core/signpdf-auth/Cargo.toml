[package]
name = "signpdf-auth"
description = "Edge OIDC login (Authorization Code + PKCE, loopback redirect) that produces ID tokens for the SignPDF core to validate. Networking lives here; the core stays offline."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Off by default so `cargo build/test --all` needs no TLS toolchain (matching the CLI's
# deliberately TLS-free `ureq`) and the mock-IdP tests run over plain-HTTP loopback. Enable
# `tls` to talk to real https providers (Google/Microsoft/Apple): native-tls uses the OS stack
# (SChannel on Windows, Secure Transport on macOS, OpenSSL on Linux) — no ring/clang build dep.
default = []
tls = ["ureq/native-tls", "dep:native-tls"]

[dependencies]
signpdf-core = { path = "../signpdf-core" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom.workspace = true
url = "2"
ureq = { version = "2", default-features = false }
thiserror.workspace = true
# TLS backend handed to ureq explicitly (ureq 2 does not configure native-tls by itself).
native-tls = { version = "0.2", optional = true }

[build-dependencies]
# build.rs reads the git-ignored client-secrets.json (see there).
serde_json.workspace = true

[dev-dependencies]
# Integration tests compile as a separate crate; mirror the externals they touch directly and
# pull the core's bundled test issuer to mint tokens for the mock IdP.
signpdf-core = { path = "../signpdf-core", features = ["test-issuer"] }
serde_json.workspace = true
getrandom.workspace = true
url = "2"
ureq = { version = "2", default-features = false }
