# ClusterFuzzLite on pull requests that change the engine: the fuzz targets are built
# from the pull request and fuzzed for 4 minutes, starting from the corpus the nightly batch run
# (cflite_batch.yml) kept. Code-change mode fuzzes only the targets whose code the change touches.
# Draft pull requests run nothing.
name: ClusterFuzzLite PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "core/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite_*.yml"

permissions: read-all

jobs:
  pr:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    concurrency:
      group: cflite-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 240
          mode: code-change
          sanitizer: address
