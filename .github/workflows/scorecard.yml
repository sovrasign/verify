# OpenSSF Scorecard (target 8 or more):
# checks this repository's security practices (pinned dependencies, token permissions, branch
# protection, fuzzing, SAST, signed releases, a security policy...) every week and on changes
# to branch protection, publishes the result to the OpenSSF API (the badge in README.md) and
# uploads the findings to code scanning. docs/RELEASES.md lists each check and what keeps it high.
#
# Scorecard only scores public repositories: skipped while this one is private.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "29 4 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
