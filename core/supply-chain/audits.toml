[[audits.ecdsa]]
who = "Sovrasign <23560268+ffrachon@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.17.0"
notes = "No unsafe code. Verification read in full: Signature::from_scalars refuses r or s of zero or not below n, verify_prehashed refuses high s where the curve asks for it, computes u1 = z/s and u2 = r/s, and compares r with x(u1 G + u2 Q) mod n (the identity gives x = 0, which never equals a non-zero r); bytes2scalar truncates the digest to the order's bit length as SEC 1 requires. DER signature parsing goes through der. No build script or I/O. Reviewed with Claude Code (AI-assisted), 2026-11-18: every unsafe block, build-time code and I/O, and panics reachable from untrusted input; not a review of cryptographic correctness, which the engine's own test vectors cover."

