[[exemptions.crypto-bigint]]
version = "0.7.10"
criteria = "safe-to-deploy"
notes = "Baseline (critical, not yet audited): 52,000 lines of constant-time big-integer arithmetic (14 unsafe sites) under RSA, ECDSA and P-256: too large for an AI-assisted review to vouch for alone; waiting for an imported audit or a human review. Its 0.7.10 -> 0.7.11 delta is audited."

[[exemptions.crypto-primes]]
version = "0.7.2"
criteria = "safe-to-deploy"
notes = "Baseline (critical, not yet audited): 5,900 lines, no unsafe. Prime generation used only for RSA key generation (test fixtures), not on the verification path; review with the next rsa update."

[[exemptions.ctutils]]
version = "0.4.6"
criteria = "safe-to-deploy"

[[exemptions.der]]
version = "0.8.3"
criteria = "safe-to-deploy"
notes = "Baseline (critical, not yet audited): 16,800 lines, deny(unsafe_code) with 4 sites: the DER parser behind every certificate, CMS and key the engine reads. Its 0.7.10 -> 0.8.3 delta is 8,000 lines; needs a careful review of its own (the engine's fuzz targets reach it through verify, timestamp and pades_verify)."

