# Which licence covers which file (https://reuse.software). Everything is MIT OR Apache-2.0
# (LICENSES/MIT.txt, LICENSES/Apache-2.0.txt; also LICENSE-MIT, LICENSE-APACHE) unless a later
# annotation below says otherwise, since of several matching annotations the last one applies: the
# format specification is CC BY 4.0, and the test vectors and corpora are CC0, so anyone can copy
# them into their own tests.
version = 1

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sovrasign LLC and contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["spec/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sovrasign LLC and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["core/signpdf-core/tests/corpus/**", "core/signpdf-core/tests/attack/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sovrasign LLC and contributors"
SPDX-License-Identifier = "CC0-1.0"

# The shared trust-list vectors (spec §12.4), and their generator, are test vectors: CC0.
[[annotations]]
path = ["spec/vectors/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sovrasign LLC and contributors"
SPDX-License-Identifier = "CC0-1.0"
