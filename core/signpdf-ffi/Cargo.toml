[package]
name = "signpdf-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "signpdf_ffi"
# cdylib: the shared library Flutter/dart:ffi loads at runtime (.dll/.so/.dylib).
# staticlib: for static linking (e.g. iOS).
# rlib: so Rust integration tests and other crates can call the FFI surface directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
signpdf-core = { path = "../signpdf-core", features = ["typed"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
signpdf-core = { path = "../signpdf-core", features = ["test-issuer"] }
lopdf.workspace = true
