
# cargo-vet audits file

[[audits.base16ct]]
who = "Sovrasign <23560268+ffrachon@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = "Unsafe only in from_utf8_unchecked over output the encoder wrote itself (every byte is an ASCII hex digit from the constant-time nibble encoder). Decoding is safe code returning errors on bad input. No build script or I/O. Reviewed with Claude Code (AI-assisted), 2026-11-18: every unsafe block, build-time code and I/O, and panics reachable from untrusted input; not a review of cryptographic correctness, which the engine's own test vectors cover."

