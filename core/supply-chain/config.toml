notes = "Baseline (critical, not yet audited): 25,000 lines, forbid(unsafe_code): the PDF parser for every untrusted document. No unsafe code, so the risk is panics and resource use, which the engine bounds (nesting and size limits) and fuzzes (documents, xref, verify, prepare, sign, intake targets). To be replaced by lopdf 0.47, which will be audited as a delta."

